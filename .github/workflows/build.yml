name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch idevice FFI from StikJIT
        run: |
          if [ ! -f idevice/libidevice_ffi.a ]; then
            git clone --depth 1 https://github.com/StephenDev0/StikJIT.git /tmp/stik
            cp -R /tmp/stik/idevice ./idevice
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project JITRemote.xcodeproj -scheme JITRemote \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JITRemote.app Payload/
          zip -qr JITRemote.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JITRemote-ipa
          path: JITRemote.ipa
