name: JITRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  JITRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: JITRemote
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to your other device over Wi-Fi to enable JIT.
        NSBonjourServices: ["_remotepairing._tcp"]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jitremote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/idevice"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/idevice"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/idevice"
        OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
        CLANG_CXX_LIBRARY: libc++
